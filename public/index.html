<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Anonymous Chat</title>


<script src="/socket.io/socket.io.js"></script>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app">



<!-- ВХОД -->

<div id="auth" class="card">


<h1>💬 Anonymous Chat</h1>


<input id="login" placeholder="Логин">


<input 
id="password"
type="password"
placeholder="Пароль"
>


<input 
id="avatar"
placeholder="Ссылка на аватар"
>



<div>


<button id="registerBtn">
Регистрация
</button>


<button id="loginBtn">
Войти
</button>


</div>


<p id="info"></p>



</div>







<!-- ЧАТ -->

<div id="chat" style="display:none;">





<div class="top">


<div id="profile">


<img id="myAvatar">


<div>

<h3 id="myName">
</h3>


<span id="myDate">
</span>


</div>


</div>




<button id="editBtn">
⚙️ Профиль
</button>



</div>









<div class="main">





<div id="users">


</div>






<div class="chatBox">


<div id="messages">

</div>



<div class="send">


<input 
id="message"
placeholder="Написать сообщение..."
>



<button id="sendBtn">
➤
</button>


</div>



</div>






</div>









<!-- НАСТРОЙКИ -->


<div id="settings" style="display:none;" class="card">


<h2>
Настройки профиля
</h2>



<input id="newLogin" placeholder="Новый ник">


<input id="newAvatar" placeholder="Новый аватар">


<button id="saveProfile">
Сохранить
</button>


<button id="closeSettings">
Закрыть
</button>



</div>








</div>





<script src="script.js"></script>


</body>

</html>
