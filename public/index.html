<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Anonymous Chat</title>

<script src="/socket.io/socket.io.js"></script>

<style>
body {
    margin:0;
    background:#111;
    color:white;
    font-family:Arial;
}

.container {
    width:400px;
    margin:100px auto;
    text-align:center;
}

input {
    width:90%;
    padding:12px;
    margin:10px;
    font-size:16px;
}

button {
    padding:12px 30px;
    background:#8a2be2;
    color:white;
    border:0;
    cursor:pointer;
    font-size:16px;
}

#chat {
    display:none;
}

.messages {
    height:300px;
    overflow:auto;
    background:#222;
    padding:10px;
    text-align:left;
}

.message {
    margin:8px;
}

</style>

</head>


<body>


<div class="container">


<div id="login">

<h1>Anonymous Chat</h1>

<input id="nickname" placeholder="Введите ник">

<br>

<button onclick="joinChat()">
Войти в чат
</button>

</div>



<div id="chat">

<h2>Чат</h2>


<div class="messages" id="messages"></div>


<input id="message" placeholder="Сообщение">


<button onclick="sendMessage()">
Отправить
</button>


</div>


</div>



<script>


const socket = io();



let nickname = "";



// вход в чат

function joinChat(){

    nickname = document.getElementById("nickname").value;


    if(nickname.trim()==""){
        nickname="Anonymous";
    }


    socket.emit("join", nickname);



    document.getElementById("login").style.display="none";

    document.getElementById("chat").style.display="block";

}



// отправка сообщения

function sendMessage(){

    let text = document.getElementById("message").value;


    if(text.trim()=="") return;


    socket.emit("chat message", {

        nick:nickname,

        text:text

    });


    document.getElementById("message").value="";

}




// получение сообщений

socket.on("chat message",(data)=>{


    let div=document.createElement("div");


    div.className="message";


    div.innerHTML="<b>"+data.nick+"</b>: "+data.text;


    document.getElementById("messages").appendChild(div);


});



</script>


</body>
</html>
