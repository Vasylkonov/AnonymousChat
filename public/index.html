<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Anonymous Chat</title>


<script src="/socket.io/socket.io.js"></script>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app">



<!-- ================= -->
<!-- АВТОРИЗАЦИЯ -->
<!-- ================= -->


<div id="auth" class="card">


<h1>💬 Anonymous Chat</h1>


<input 
id="login"
placeholder="Логин"
>


<input 
id="password"
type="password"
placeholder="Пароль"
>


<input 
id="avatar"
placeholder="Ссылка на аватар"
>



<button id="registerBtn">
Создать аккаунт
</button>


<button id="loginBtn">
Войти
</button>



<p id="info"></p>


</div>









<!-- ================= -->
<!-- ЧАТ -->
<!-- ================= -->


<div id="chat" style="display:none;">



<header class="top">


<div class="profile-mini">


<img id="myAvatar"
src="">


<div>

<h3 id="myName">
User
</h3>


<span id="myDate">
</span>


</div>


</div>



<button id="editBtn">
👤 Профиль
</button>



</header>








<div class="content">



<aside id="users">


<h3>
🟢 Онлайн
</h3>


</aside>






<section class="chat-area">



<div id="messages">

</div>






<div class="send">


<input 
id="message"
placeholder="Сообщение..."
>


<button id="sendBtn">
➤
</button>


</div>



</section>




</div>






</div>









<!-- ================= -->
<!-- ПРОФИЛЬ -->
<!-- ================= -->


<div id="settings" 
style="display:none;"
class="profile-window">



<div class="profile-card">



<button id="closeSettings">
❌
</button>




<img 
id="profileAvatar"
class="big-avatar"
>





<h2 id="profileName">
</h2>


<p id="profileDate">
</p>





<hr>




<input
id="newLogin"
placeholder="Новый ник"
>




<input
id="newAvatar"
placeholder="Новый аватар"
>





<button id="saveProfile">
💾 Сохранить профиль
</button>








<hr>




<input
id="newPassword"
type="password"
placeholder="Новый пароль"
>




<button id="changePassword">
🔒 Сменить пароль
</button>






<button id="logout">
🚪 Выйти
</button>





</div>



</div>










<script src="script.js"></script>


</body>

</html>
