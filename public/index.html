<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<title>Anonymous Chat</title>

<script src="/socket.io/socket.io.js"></script>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


<div id="login">

<h1>Anonymous Chat</h1>


<input 
id="nickname"
placeholder="Введите ник"
>


<button id="joinBtn">
Войти в чат
</button>


</div>




<div id="chat" style="display:none;">


<h1>💬 Чат</h1>


<div id="messages"></div>



<div class="send">


<input 
id="message"
placeholder="Сообщение"
>


<button id="sendBtn">
Отправить
</button>


</div>


</div>



</div>



<script src="script.js"></script>


</body>

</html>
